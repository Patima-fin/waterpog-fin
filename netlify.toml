[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ไม่ต้องใช้ .jsx extension ในเบราว์เซอร์
[[headers]]
  for = "/*.jsx"
  [headers.values]
    Content-Type = "text/javascript"
