  <style>
    /* Critical above-the-fold for splash */
    html, body { background: #f4f7fb; }
    #splash { position: fixed; inset: 0; display: grid; place-items: center; background: #f4f7fb; z-index: 9999; transition: opacity 360ms ease; }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash .spin { width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, #2a6fdb, #1a4490); display: grid; place-items: center; box-shadow: 0 12px 32px rgba(31, 86, 184, 0.25); animation: pulse 1.6s ease-in-out infinite; }
    #splash .lbl { margin-top: 16px; color: #475063; font: 14px/1 "IBM Plex Sans Thai", system-ui; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    .no-anim *, .no-anim *:before, .no-anim *:after { animation-duration: 0ms !important; transition: none !important; }
  </style>
</head>
<body>
  <div id="splash">
    <div style="text-align:center">
      <div class="spin">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
          <path d="M3 5 L6 19 L9 9 L12 16 L15 9 L18 19 L21 5" stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="lbl">กำลังโหลด Water POG Financial Console…</div>
    </div>
  </div>

  <div id="root"></div>

  <!-- Data + Components + Tweaks panel + App -->
  <script src="app/config.js?v=20260525k"></script>

  <script type="text/babel" src="app/components.jsx?v=20260526a"></script>
  <script type="text/babel" src="app/charts.jsx?v=20260523n"></script>
  <script type="text/babel" src="app/page_daily.jsx?v=20260526j"></script>

  <script type="text/babel" src="app/page_warroom_p2.jsx?v=20260526p"></script>
  <script type="text/babel" src="app/page_projects.jsx?v=20260525l"></script>

  <script type="text/babel" src="app/page_receipts.jsx?v=20260525j"></script>
  <script type="text/babel" src="app/page_bank_diary.jsx?v=20260525l"></script>

  <script>
    // Hide splash once React mounts
    const obs = new MutationObserver(() => {
      const root = document.getElementById('root');
      if (root && root.children.length > 0) {
        const sp = document.getElementById('splash');
        if (sp) {
          sp.classList.add('gone');
          setTimeout(() => sp.remove(), 400);
        }
        obs.disconnect();
      }
    });
    obs.observe(document.getElementById('root'), { childList: true });
    setTimeout(() => { const sp = document.getElementById('splash'); if (sp) { sp.classList.add('gone'); setTimeout(() => sp.remove(), 400); } }, 4000);
  </script>
</body>
